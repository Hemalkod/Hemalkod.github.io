<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <title>Administrátor</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/summernote/0.8.18/summernote-lite.css" rel="stylesheet">
  <style>
    #editor-container {
      height: 300px;
    }
  </style>
</head>
<body>
  <h1>Přidat nový článek</h1>
  <form id="admin-form">
    <label>Název článku:<br><input type="text" id="title" required></label><br><br>
    <label>Obsah článku:</label><br>
    <div id="editor-container"></div><br>
    <button type="submit">Vytvořit článek</button>
  </form>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/summernote/0.8.18/summernote-lite.js"></script>
  <script>
    const password = prompt("Zadej heslo:");
    if (password !== "35783543256732544thrrrrgth") {
      alert("Nesprávné heslo!");
      window.location.href = "index.html";
    }

    // Inicializace Summernote editoru
    $('#editor-container').summernote({
      height: 300,  // Výška editoru
      toolbar: [
        ['style', ['bold', 'italic', 'underline', 'clear']],
        ['font', ['strikethrough', 'superscript', 'subscript']],
        ['fontsize', ['fontsize']],
        ['color', ['color']],
        ['para', ['ul', 'ol', 'paragraph']],
        ['insert', ['link', 'picture', 'video']]
      ],
      imageUploadURL: '/upload_image'  // Pro nahrávání obrázků na server (můžeš přizpůsobit)
    });

    document.getElementById('admin-form').addEventListener('submit', function(e) {
      e.preventDefault();
      const title = document.getElementById('title').value;
      const content = $('#editor-container').summernote('code');  // Získání HTML obsahu z editoru

      const newArticle = {
        id: Date.now(),
        title: title,
        content: content
      };

      fetch('articles.json')
        .then(response => response.json())
        .then(data => {
          data.push(newArticle);
          const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = 'articles.json';
          a.click();
          URL.revokeObjectURL(url);
          alert('Článek byl vytvořen. Nahraj nový soubor articles.json na GitHub.');
        });
    });
  </script>
</body>
</html>
